services:
  qhsse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qhsse_consultant_portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
